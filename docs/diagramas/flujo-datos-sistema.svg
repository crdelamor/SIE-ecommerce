<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="Segoe UI, Arial, sans-serif">
<title>Flujo de datos de todo el sistema: tienda, n8n, back-office y Telegram</title>
<defs>
<marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker>
<style>
.col { fill: #f6f8fb; stroke: #b8c2d0; stroke-width: 1.5; }
.tg { fill: #f2f8fc; stroke: #8fb8d6; stroke-width: 1.5; }
.hd { font-size: 19px; font-weight: 700; fill: #1f4e79; }
.ttl { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
.sub { font-size: 13px; fill: #555; }
.box { fill: #fff; stroke: #1f4e79; stroke-width: 1.5; }
.db { fill: #eef4fb; stroke: #1f4e79; stroke-width: 1.5; }
.ag { fill: #f3f0fb; stroke: #5b4a9e; stroke-width: 1.5; }
.rt { fill: #fff7ee; stroke: #d9822b; stroke-width: 1.5; stroke-dasharray: 6 4; }
.tb { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
.ts { font-size: 12px; fill: #444; }
.code { font-family: Consolas, monospace; font-size: 12px; fill: #333; }
.ln { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#f); }
.lr { stroke: #d9822b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#fr); }
.num { fill: #2e75b6; }
.numt { font-size: 12px; font-weight: 700; fill: #fff; }
.tag { fill: #1f4e79; }
.tagt { font-size: 11px; font-weight: 700; fill: #fff; }
.leg { font-size: 12.5px; fill: #1a1a1a; }
</style></defs>
<rect width="1240" height="930" fill="#fff"/>
<text class="ttl" x="30" y="38">The Black Lotus TCG · flujo de datos de todo el sistema</text>
<rect class="col" x="30" y="60" width="300" height="580" rx="12"/>
<text class="hd" x="50" y="90">Tienda</text><text class="sub" x="50" y="110">DonDominio · PHP + MySQL</text>
<rect class="col" x="420" y="60" width="400" height="580" rx="12"/>
<text class="hd" x="440" y="90">n8n</text><text class="sub" x="440" y="110">Azure · PostgreSQL propio · 6 flujos</text>
<rect class="col" x="910" y="60" width="300" height="580" rx="12"/>
<text class="hd" x="930" y="90">Back-office</text><text class="sub" x="930" y="110">Azure · MySQL propio</text>
<rect class="tg" x="30" y="660" width="1180" height="120" rx="12"/>
<text class="hd" x="50" y="688">Telegram</text><text class="sub" x="140" y="688">bot de pruebas</text>
<rect class="box" x="55" y="130" width="250" height="56" rx="8"/>
<text class="tb" x="180" y="154" text-anchor="middle">Cliente</text>
<text class="ts" x="180" y="172" text-anchor="middle">compra, paga, pide soporte y navega</text>
<path class="ln" d="M180,186 V225"/>
<rect class="db" x="55" y="225" width="250" height="84" rx="8"/>
<text class="tb" x="180" y="254" text-anchor="middle">Base de datos de la tienda</text>
<text class="ts" x="180" y="272" text-anchor="middle">pedidos, incidencias y tabla events</text>
<text class="ts" x="180" y="290" text-anchor="middle">(evento en la misma transacción)</text>
<rect class="box" x="55" y="380" width="250" height="150" rx="8"/>
<text class="tb" x="180" y="415" text-anchor="middle">API de integración · X-Api-Key</text>
<text class="code" x="180" y="433" text-anchor="middle">/orders/{code}</text>
<text class="code" x="180" y="451" text-anchor="middle">/events?after_id=</text>
<text class="code" x="180" y="469" text-anchor="middle">/tickets/{id}</text>
<text class="code" x="180" y="487" text-anchor="middle">/visits?from=&amp;to=</text>
<text class="code" x="180" y="505" text-anchor="middle"></text>
<text class="ts" x="180" y="515" text-anchor="middle">solo lectura</text>
<rect class="box" x="440" y="130" width="360" height="56" rx="8"/>
<text class="tb" x="620" y="154" text-anchor="middle">Pedidos · webhook</text>
<text class="ts" x="620" y="172" text-anchor="middle">valida el sobre y separa por tipo de evento</text>
<rect class="tag" x="774" y="136" width="20" height="18" rx="4"/>
<text class="tagt" x="784" y="149" text-anchor="middle">A</text>
<rect class="ag" x="440" y="218" width="360" height="96" rx="8"/>
<text class="tb" x="620" y="244" text-anchor="middle">Incidencias + agente de IA (Gemini)</text>
<text class="ts" x="620" y="262" text-anchor="middle">ticket en el back-office y agente con herramientas</text>
<text class="ts" x="620" y="280" text-anchor="middle">consulta pedido e historial, clasifica y propone</text>
<text class="ts" x="620" y="298" text-anchor="middle">la propuesta espera la aprobación humana</text>
<rect class="tag" x="774" y="224" width="20" height="18" rx="4"/>
<text class="tagt" x="784" y="237" text-anchor="middle">C</text>
<rect class="box" x="440" y="330" width="360" height="50" rx="8"/>
<text class="tb" x="620" y="351" text-anchor="middle">Telegram · /start con firma</text>
<text class="ts" x="620" y="369" text-anchor="middle">guarda el chat del cliente en su ticket</text>
<rect class="tag" x="774" y="336" width="20" height="18" rx="4"/>
<text class="tagt" x="784" y="349" text-anchor="middle">C</text>
<rect class="rt" x="440" y="396" width="360" height="50" rx="8"/>
<text class="tb" x="620" y="417" text-anchor="middle">Reintentos · cada 5 min</text>
<text class="ts" x="620" y="435" text-anchor="middle">pendientes y eventos que no llegaron</text>
<rect class="tag" x="774" y="402" width="20" height="18" rx="4"/>
<text class="tagt" x="784" y="415" text-anchor="middle">A</text>
<rect class="box" x="440" y="462" width="360" height="50" rx="8"/>
<text class="tb" x="620" y="483" text-anchor="middle">Analítica · cada hora</text>
<text class="ts" x="620" y="501" text-anchor="middle">visitas por día (pendiente de publicar)</text>
<rect class="tag" x="774" y="468" width="20" height="18" rx="4"/>
<text class="tagt" x="784" y="481" text-anchor="middle">A</text>
<rect class="box" x="440" y="528" width="360" height="50" rx="8"/>
<text class="tb" x="620" y="549" text-anchor="middle">Errores</text>
<text class="ts" x="620" y="567" text-anchor="middle">si falla otro flujo, avisa al equipo</text>
<rect class="tag" x="774" y="534" width="20" height="18" rx="4"/>
<text class="tagt" x="784" y="547" text-anchor="middle">A</text>
<rect class="box" x="930" y="130" width="260" height="96" rx="8"/>
<text class="tb" x="1060" y="156" text-anchor="middle">API /bo-api · X-Api-Key</text>
<text class="ts" x="1060" y="174" text-anchor="middle">pedidos e historial · tickets</text>
<text class="ts" x="1060" y="192" text-anchor="middle">propuestas · registro · visitas</text>
<text class="ts" x="1060" y="210" text-anchor="middle">201 · 200 duplicado · 404 · 422</text>
<path class="ln" d="M1060,226 V270"/>
<rect class="db" x="930" y="270" width="260" height="150" rx="8"/>
<text class="tb" x="1060" y="305" text-anchor="middle">Base de datos propia</text>
<text class="code" x="1060" y="323" text-anchor="middle">bo_orders · bo_order_lines</text>
<text class="code" x="1060" y="341" text-anchor="middle">bo_order_status_log</text>
<text class="code" x="1060" y="359" text-anchor="middle">bo_customers · bo_tickets</text>
<text class="code" x="1060" y="377" text-anchor="middle">bo_agent_proposals</text>
<text class="code" x="1060" y="395" text-anchor="middle">bo_integration_log</text>
<path class="ln" d="M1060,420 V470"/>
<rect class="box" x="930" y="470" width="260" height="70" rx="8"/>
<text class="tb" x="1060" y="501" text-anchor="middle">Gestor · login propio</text>
<text class="ts" x="1060" y="519" text-anchor="middle">pedidos, registro y cuadro de mando</text>
<rect class="tag" x="1164" y="476" width="20" height="18" rx="4"/>
<text class="tagt" x="1174" y="489" text-anchor="middle">B</text>
<rect class="box" x="55" y="705" width="250" height="60" rx="8"/>
<text class="tb" x="180" y="731" text-anchor="middle">Cliente en Telegram</text>
<text class="ts" x="180" y="749" text-anchor="middle">sigue su incidencia y recibe la respuesta</text>
<rect class="box" x="440" y="705" width="360" height="60" rx="8"/>
<text class="tb" x="620" y="731" text-anchor="middle">Grupo del equipo</text>
<text class="ts" x="620" y="749" text-anchor="middle">aprueba o rechaza propuestas · avisos de error</text>
<path class="ln" d="M305,262 C375,262 375,150 440,150"/>
<circle class="num" cx="372" cy="214" r="11"/><text class="numt" x="372" y="218.5" text-anchor="middle">1</text>
<path class="ln" d="M440,172 L305,412"/>
<path class="ln" d="M440,296 L305,440"/>
<path class="ln" d="M440,432 L305,468"/>
<path class="ln" d="M440,498 L305,496"/>
<circle class="num" cx="352" cy="330" r="11"/><text class="numt" x="352" y="334.5" text-anchor="middle">2</text>
<path class="ln" d="M800,150 L930,150"/>
<path class="ln" d="M800,250 L930,180"/>
<path class="ln" d="M800,355 L930,205"/>
<circle class="num" cx="865" cy="150" r="11"/><text class="numt" x="865" y="154.5" text-anchor="middle">3</text>
<path class="ln" d="M620,186 V218"/>
<circle class="num" cx="648" cy="202" r="11"/><text class="numt" x="648" y="206.5" text-anchor="middle">4</text>
<path class="ln" d="M800,282 H852 V735 H800" marker-start="url(#f)"/>
<circle class="num" cx="852" cy="620" r="11"/><text class="numt" x="852" y="624.5" text-anchor="middle">5</text>
<path class="ln" d="M440,300 H405 V722 H305"/>
<circle class="num" cx="405" cy="612" r="11"/><text class="numt" x="405" y="616.5" text-anchor="middle">6</text>
<path class="ln" d="M305,750 H382 V355 H440"/>
<circle class="num" cx="382" cy="560" r="11"/><text class="numt" x="382" y="564.5" text-anchor="middle">7</text>
<path class="lr" d="M800,410 C838,410 838,172 800,172"/>
<circle class="num" cx="829" cy="300" r="11"/><text class="numt" x="829" y="304.5" text-anchor="middle">8</text>
<path class="ln" d="M800,487 L930,215"/>
<circle class="num" cx="880" cy="320" r="11"/><text class="numt" x="880" y="324.5" text-anchor="middle">9</text>
<path class="ln" d="M620,578 V705"/>
<circle class="num" cx="648" cy="645" r="11"/><text class="numt" x="648" y="649.5" text-anchor="middle">10</text>
<circle class="num" cx="51" cy="808" r="11"/><text class="numt" x="51" y="812.5" text-anchor="middle">1</text>
<text class="leg" x="70" y="812">La tienda envía el evento al webhook (X-Webhook-Secret).</text>
<circle class="num" cx="51" cy="829" r="11"/><text class="numt" x="51" y="833.5" text-anchor="middle">2</text>
<text class="leg" x="70" y="833">n8n pide los datos completos a la tienda (X-Api-Key, solo lectura).</text>
<circle class="num" cx="51" cy="850" r="11"/><text class="numt" x="51" y="854.5" text-anchor="middle">3</text>
<text class="leg" x="70" y="854">Crea o actualiza en el back-office y registra cada resultado.</text>
<circle class="num" cx="51" cy="871" r="11"/><text class="numt" x="51" y="875.5" text-anchor="middle">4</text>
<text class="leg" x="70" y="875">support.requested pasa a Incidencias, donde propone el agente.</text>
<circle class="num" cx="51" cy="892" r="11"/><text class="numt" x="51" y="896.5" text-anchor="middle">5</text>
<text class="leg" x="70" y="896">Una persona aprueba o rechaza la propuesta en el grupo.</text>
<circle class="num" cx="651" cy="808" r="11"/><text class="numt" x="651" y="812.5" text-anchor="middle">6</text>
<text class="leg" x="670" y="812">Si se aprueba, la respuesta llega al cliente por Telegram.</text>
<circle class="num" cx="651" cy="829" r="11"/><text class="numt" x="651" y="833.5" text-anchor="middle">7</text>
<text class="leg" x="670" y="833">El cliente enlaza su chat con /start y la firma del enlace.</text>
<circle class="num" cx="651" cy="850" r="11"/><text class="numt" x="651" y="854.5" text-anchor="middle">8</text>
<text class="leg" x="670" y="854">Reintentos recupera lo que falló o no llegó (en naranja).</text>
<circle class="num" cx="651" cy="871" r="11"/><text class="numt" x="651" y="875.5" text-anchor="middle">9</text>
<text class="leg" x="670" y="875">Analítica lleva las visitas por día al cuadro de mando.</text>
<circle class="num" cx="651" cy="892" r="11"/><text class="numt" x="651" y="896.5" text-anchor="middle">10</text>
<text class="leg" x="670" y="896">Errores avisa al grupo de cualquier fallo de un flujo.</text>
<text class="ts" x="40" y="918">A, B y C: parte del grupo que lo hizo (César, José y Celia). Los eventos de navegación no salen de la tienda: solo los totales por día de Analítica.</text>
</svg>
